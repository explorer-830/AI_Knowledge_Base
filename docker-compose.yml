services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      EMBEDDING_MODEL_PATH: /app/models/embedding
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads
      - ${EMBEDDING_MODEL_HOST_PATH:-./models/bge-small-zh-v1.5}:/app/models/embedding:ro

  frontend:
    image: nginx:stable-alpine
    ports:
      - "4000:80"
    depends_on:
      - backend
    volumes:
      - ./frontend-web:/usr/share/nginx/html:ro
